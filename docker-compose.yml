# Local development only. The deployed database is RDS. See IMPLEMENTATION_PLAN.md §10.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aguda
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: aguda
    ports:
      - "127.0.0.1:5433:5432"   # loopback only. Docker bypasses the host firewall
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aguda -d aguda"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
